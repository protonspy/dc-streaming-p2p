# coturn, for development only.
#
# The credential mechanism is the one the central server issues against: the
# username is an expiry timestamp and the password is its HMAC under the shared
# secret, so nothing here holds a user list.

listening-port=3478
fingerprint

# Time-limited credentials. This secret is also CENTRAL_TURN_SECRET in
# compose.yaml, and a real deployment takes both from the same secret store
# rather than from a committed file.
use-auth-secret
static-auth-secret=development-turn-secret
realm=dc-streaming-p2p.local

# The allocation range the relay hands out. Narrow, because development needs a
# handful of calls and a wide range is slow to publish through Docker.
min-port=49160
max-port=49200

# Refuse to relay to the machine's own networks. A relay that will forward to
# 127.0.0.1 or to a private range is a proxy into whatever else is listening
# there, and that is the standard way an open TURN server becomes someone else's
# scanner.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas, so one client cannot take the whole relay.
user-quota=12
total-quota=100

# No TLS here: development runs over plain turn:. A deployment terminates turns:
# with a real certificate, which is also what a browser on an HTTPS page needs.
no-cli
log-file=stdout
simple-log
